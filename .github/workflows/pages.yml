name: pages

on:
  # Trigger after a successful CI run on main so we can pull its artifacts
  # (Playwright report, coverage, JUnit XMLs, etc.) into the dashboard.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual trigger for first-time setup and re-deploys without waiting for CI.
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

# Required by actions/deploy-pages and for cross-workflow artifact downloads.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

env:
  NODE_VERSION: "22"
  PAGES_BASE: /qa-automation-lab
  # Each artifact name below MUST match what ci.yml / perf.yml upload.
  CI_ARTIFACTS: |
    demo-app-reports
    web-coverage
    web-junit
    pytest-api-report
    schemathesis-report
    playwright-report
    cypress-artifacts
  PERF_ARTIFACTS: |
    k6-summary

jobs:
  build:
    # Skip if the upstream CI run did not succeed; still allow manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve CI run id to pull artifacts from
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            ci_run_id="${{ github.event.workflow_run.id }}"
            ci_run_url="${{ github.event.workflow_run.html_url }}"
            ci_sha="${{ github.event.workflow_run.head_sha }}"
            ci_at="${{ github.event.workflow_run.updated_at }}"
          else
            ci_run_id="$(gh run list --workflow=ci.yml --branch=main --status=success --limit=1 --json databaseId --jq '.[0].databaseId')"
            ci_run_url="$(gh run list --workflow=ci.yml --branch=main --status=success --limit=1 --json url --jq '.[0].url')"
            ci_sha="$(gh run list --workflow=ci.yml --branch=main --status=success --limit=1 --json headSha --jq '.[0].headSha')"
            ci_at="$(gh run list --workflow=ci.yml --branch=main --status=success --limit=1 --json updatedAt --jq '.[0].updatedAt')"
          fi
          # Use status=completed (not success) so failed-threshold runs still
          # populate the perf card. The k6 summary artifact is uploaded with
          # if: always() in perf.yml, and the dashboard has a dedicated red
          # "thresholds violated" state for these runs.
          perf_run_id="$(gh run list --workflow=perf.yml --branch=main --status=completed --limit=1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          echo "ci_run_id=${ci_run_id:-}" >> "$GITHUB_OUTPUT"
          echo "ci_run_url=${ci_run_url:-}" >> "$GITHUB_OUTPUT"
          echo "ci_sha=${ci_sha:-}" >> "$GITHUB_OUTPUT"
          echo "ci_at=${ci_at:-}" >> "$GITHUB_OUTPUT"
          echo "perf_run_id=${perf_run_id:-}" >> "$GITHUB_OUTPUT"

      - name: Download CI artifacts
        if: steps.resolve.outputs.ci_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.resolve.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          mkdir -p _artifacts
          while IFS= read -r name; do
            name="$(echo "$name" | xargs)"
            [ -z "$name" ] && continue
            echo "::group::Download $name from CI run $RUN_ID"
            gh run download "$RUN_ID" --name "$name" --dir "_artifacts/$name" \
              || echo "::warning::artifact $name not present in CI run $RUN_ID"
            echo "::endgroup::"
          done <<EOF
          ${{ env.CI_ARTIFACTS }}
          EOF

      - name: Download perf artifacts
        if: steps.resolve.outputs.perf_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.resolve.outputs.perf_run_id }}
        run: |
          set -euo pipefail
          mkdir -p _artifacts
          while IFS= read -r name; do
            name="$(echo "$name" | xargs)"
            [ -z "$name" ] && continue
            echo "::group::Download $name from perf run $RUN_ID"
            gh run download "$RUN_ID" --name "$name" --dir "_artifacts/$name" \
              || echo "::warning::artifact $name not present in perf run $RUN_ID"
            echo "::endgroup::"
          done <<EOF
          ${{ env.PERF_ARTIFACTS }}
          EOF

      - name: Write CI metadata for the dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.resolve.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          mkdir -p _artifacts/ci-meta
          short_sha="$(echo "${{ steps.resolve.outputs.ci_sha }}" | cut -c1-7)"

          # Pull wall-clock seconds for the CI run so the dashboard can
          # report end-to-end pipeline time alongside summed test time.
          # run_started_at is the moment the runner picked up the first
          # job; updated_at is the run's final timestamp. We default
          # wall_clock_sec to null when either value is missing so the
          # dashboard can hide the tile cleanly.
          wall_clock_sec="null"
          if [ -n "${RUN_ID:-}" ]; then
            run_json="$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" 2>/dev/null || echo '{}')"
            started="$(echo "$run_json" | jq -r '.run_started_at // empty')"
            ended="$(echo "$run_json" | jq -r '.updated_at // empty')"
            if [ -n "$started" ] && [ -n "$ended" ]; then
              wall_clock_sec="$(python3 -c "from datetime import datetime; s=datetime.fromisoformat('${started}'.replace('Z','+00:00')); e=datetime.fromisoformat('${ended}'.replace('Z','+00:00')); print(f'{(e-s).total_seconds():.1f}')")"
            fi
          fi

          cat > _artifacts/ci-meta/meta.json <<JSON
          {
            "sha": "${{ steps.resolve.outputs.ci_sha }}",
            "short_sha": "${short_sha}",
            "ref": "main",
            "run_id": "${{ steps.resolve.outputs.ci_run_id }}",
            "run_url": "${{ steps.resolve.outputs.ci_run_url }}",
            "triggered_at": "${{ steps.resolve.outputs.ci_at }}",
            "wall_clock_sec": ${wall_clock_sec}
          }
          JSON

      - name: Build dashboard
        env:
          PAGES_BASE: ${{ env.PAGES_BASE }}
          DEFECT_DISPATCH_URL: ${{ secrets.DEFECT_DISPATCH_URL }}
        run: |
          node scripts/build-pages-dashboard.mjs \
            --artifacts-dir _artifacts \
            --pages-dir pages \
            --out _site

      - name: Inspect generated site
        run: |
          set -euo pipefail
          ls -la _site
          echo "---"
          ls -la _site/reports || true
          echo "---"
          find _site -maxdepth 3 -type f | head -50

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
