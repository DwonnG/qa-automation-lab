repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [json, yaml, markdown, javascript, jsx, ts, tsx]
        # mockServiceWorker.js is regenerated by `msw init` and would drift
        # back to MSW's own formatting on every upgrade, churning CI.
        exclude: ^(web/dist|playwright-report|cypress/screenshots|cypress/videos|web/public/mockServiceWorker\.js)

  # ESLint runs per-subproject in CI (`web`, `playwright`, `cypress`) where
  # each project owns its own flat config (`eslint.config.mjs`). Running
  # eslint from the repo root has no config to anchor against.

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/crate-ci/typos
    rev: v1.28.4
    hooks:
      - id: typos

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.20.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"
