[project]
name = "schemathesis-suite"
version = "0.1.0"
description = "OpenAPI contract and property-based tests for the qa-automation-lab demo backend."
requires-python = ">=3.13"
dependencies = [
  "schemathesis>=4.19.0,<5",
  "pytest>=8.3.0",
  "pytest-xdist>=3.6.0",
  "httpx>=0.27.0",
  "hypothesis>=6.115.0",
]

[dependency-groups]
dev = [
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
markers = [
  "smoke: minimal critical-path checks; run on every commit",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]
