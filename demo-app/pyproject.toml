[project]
name = "demo-app"
version = "0.1.0"
description = "FastAPI backend for the qa-automation-lab demo: PIN auth + items CRUD."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.9.0",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "pytest-xdist>=3.6.0",
  "pytest-randomly>=3.16.0",
  "httpx>=0.27.0",
  "faker>=33.0.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: pure-logic tests with no FastAPI app boot",
  "integration: tests that exercise FastAPI handlers via TestClient",
]
addopts = [
  "-ra",
  "--strict-markers",
  "--cov=demo_app",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-branch",
]

[tool.coverage.run]
source = ["demo_app"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "UP", # pyupgrade
  "S",  # flake8-bandit
  "N",  # pep8-naming
  "RUF",
]
ignore = [
  "S101", # asserts allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]
