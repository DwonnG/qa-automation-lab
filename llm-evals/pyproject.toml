[project]
name = "llm-evals"
version = "0.1.0"
description = "LLM evaluation layer for qa-automation-lab: LangSmith-traced generation + LLM-as-judge scoring against a golden dataset."
requires-python = ">=3.13"
dependencies = [
  "anthropic>=0.40.0",
  "langsmith>=0.1.140",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-xdist>=3.6.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: tests that hit a real LLM provider; require OPENAI_API_KEY",
]
addopts = [
  "-ra",
  "--strict-markers",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
