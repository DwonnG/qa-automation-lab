[project]
name = "pytest-api"
version = "0.1.0"
description = "End-to-end API tests against the qa-automation-lab demo backend."
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.27.0",
  "pytest>=9.1.1",
  "pytest-xdist>=3.6.0",
  "pytest-randomly>=3.16.0",
  "faker>=40.37.0",
]

[dependency-groups]
dev = [
  "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "smoke: minimal critical-path checks; run on every commit",
  "regression: comprehensive checks; run on PRs and pre-release",
]
addopts = [
  "-ra",
  "--strict-markers",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
