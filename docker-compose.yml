services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: qa-automation-lab:latest
    container_name: qa-automation-lab
    ports:
      - "5050:5050"
    environment:
      APP_ENV: ${APP_ENV:-production}
    restart: unless-stopped
    read_only: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:5050/api/health || exit 1",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
